name: Releasability Status
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Build]  # Name must match the build workflow
    types:
      - completed
    branches:
      - master
      - branch-*

jobs:
  releasability-status:
    name: Releasability status
    runs-on: sonar-s-public
    permissions:
      id-token: write
      statuses: write
      contents: read
    steps:
      - uses: SonarSource/gh-action_releasability/releasability-status@c6b5a4b3c2d1e0f9a8b7c6d5e4f3a2b1c0d9e8f7 # v3
        with:
          optional_checks: 'Jira'
        env:
          GITHUB_TOKEN: ${{ github.token }}
