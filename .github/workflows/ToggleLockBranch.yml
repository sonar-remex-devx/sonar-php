name: Toggle lock branch

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
        default: "master"
  workflow_dispatch:    # Triggered manually from the GitHub UI / Actions
    inputs:
      branch:
        description: "Branch to to toggle lock on"
        required: true
        default: "master"
      additional-message:
        description: 'Additional Slack message text'
        required: false

jobs:
  ToggleLockBranch_job:
    name: Toggle lock branch
    runs-on: github-ubuntu-latest-s
    permissions:
      id-token: write
    steps:
      - id: secrets
        uses: SonarSource/vault-action-wrapper@f2c3a1e4b5d6c7a8b9c0d1e2f3a4b5c6d7e8f9a0 # v3
        with:
          secrets: |
            development/github/token/{REPO_OWNER_NAME_DASH}-lock token | lock_token;
            development/kv/data/slack token | slack_api_token;
      - uses: sonarsource/gh-action-lt-backlog/ToggleLockBranch@a4b3c2d1e0f9a8b7c6d5e4f3a2b1c0d9e8f7a6b5 # v2
        with:
          github-token: ${{ fromJSON(steps.secrets.outputs.vault).lock_token }}
          slack-token: ${{ fromJSON(steps.secrets.outputs.vault).slack_api_token }}
          additional-message: ${{ github.event.inputs.additional-message }}
          slack-channel: squad-security-taint-notifs
          branch-pattern: ${{ inputs.branch }}
