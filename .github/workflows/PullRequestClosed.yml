name: Pull Request Closed

on:
  pull_request:
    types: [closed]

jobs:
  PullRequestMerged_job:
    name: Pull Request Merged
    runs-on: github-ubuntu-latest-s
    permissions:
      id-token: write
      pull-requests: read
    # For external PR, ticket should be moved manually
    if: |
        github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - id: secrets
        uses: SonarSource/vault-action-wrapper@f2c3a1e4b5d6c7a8b9c0d1e2f3a4b5c6d7e8f9a0 # v3
        with:
          secrets: |
            development/kv/data/jira user | JIRA_USER;
            development/kv/data/jira token | JIRA_TOKEN;
      - uses: sonarsource/gh-action-lt-backlog/PullRequestClosed@a4b3c2d1e0f9a8b7c6d5e4f3a2b1c0d9e8f7a6b5 # v2
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          jira-user:  ${{ fromJSON(steps.secrets.outputs.vault).JIRA_USER }}
          jira-token: ${{ fromJSON(steps.secrets.outputs.vault).JIRA_TOKEN }}
          fix-version: autodetect-lowest
